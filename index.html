<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14283f"><title>NIRC 트랙 랩 페이스</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><style>
:root{font-family:system-ui,sans-serif;color:#14283f;background:#edf2f7;font-size:16px}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:20px 12px 36px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}h1{font-size:22px;margin:4px 0}small{font-size:12px;color:#597087}.brand{font-weight:900;letter-spacing:.1em;color:#147665}.card{background:white;border:1px solid #d8e1eb;border-radius:16px;padding:16px;margin-bottom:18px}label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}.inputs{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}.time{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.time label{text-align:center;font-weight:400;margin-top:4px;font-size:12px}input,select,button{font:inherit}input,select{width:100%;min-width:0;height:46px;border:1px solid #c7d3df;border-radius:9px;background:#f8fafc;padding:5px;text-align:center;color:inherit}button{cursor:pointer;touch-action:manipulation;border:1px solid #cad6e2;border-radius:8px;background:white;color:inherit}.calculate{width:100%;height:48px;background:#14283f;color:white;font-weight:700;margin-top:14px;border:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:18px;text-align:center}.stats span,.summary span{display:block;color:#597087;font-size:12px;margin-bottom:5px}.stats strong{font-size:16px;font-variant-numeric:tabular-nums}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}h2{font-size:17px;margin:0 0 5px}.reset{padding:10px;font-size:14px}.table{border:1px solid #d3deea;border-radius:12px;overflow:hidden;background:white}.row{display:grid;grid-template-columns:44px 58px 92px minmax(65px,1fr) minmax(74px,1fr);align-items:center;text-align:center;border-top:1px solid #e3eaf1;font-variant-numeric:tabular-nums;font-size:14px;min-height:59px}.row>div{padding:8px 2px;min-width:0}.thead{background:#14283f;color:white;border:0;font-size:12px;min-height:40px;position:sticky;top:0}.controls{display:flex;justify-content:center;align-items:center;gap:2px}.controls button{width:30px;height:40px;font-size:20px}.controls span{width:28px;font-size:13px}.mark{display:block;background:#e0f3ec;color:#12604d;border-radius:6px;padding:5px 1px;font-size:12px;font-weight:700}.mark b{display:block;font-size:14px}.summary{margin-top:16px;background:#14283f;color:white;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;text-align:center;padding:18px 6px;border-radius:12px;position:sticky;bottom:8px;box-shadow:0 4px 20px #14283f25}.summary span{color:#bed0e0}.summary strong{font-size:17px;white-space:nowrap}.error{color:#b32929;font-size:14px}#schedule{line-height:1.5} @media(max-width:370px){main{padding:14px 8px}.card{padding:12px}.row{grid-template-columns:36px 52px 88px minmax(58px,1fr) minmax(65px,1fr);font-size:13px}.stats strong{font-size:14px}.summary strong{font-size:15px}}
.lap-pace{display:block;color:#147665;font-weight:700;margin-top:5px;font-size:13px;white-space:nowrap}.lap-pace small{font-size:10px;color:#597087;display:block;font-weight:400}</style></head><body><main><header><div><div class="brand">NIRC</div><h1>트랙 랩 페이스</h1></div><small>v1.1</small></header><section class="card"><form id="form"><div class="inputs"><div><label for="distance">거리</label><select id="distance"><option value="5000">5,000m</option><option value="8000">8,000m</option><option value="10000">10,000m</option><option value="20000">20,000m</option><option value="21100">하프 21.1km</option><option value="40000">40,000m</option><option value="42195">풀 42.195km</option></select></div><div><label>목표 기록</label><div class="time"><div><input id="hours" aria-label="시간" inputmode="numeric" type="number" min="0" max="99" value="0"><label for="hours">시간</label></div><div><input id="minutes" aria-label="분" inputmode="numeric" type="number" min="0" max="59" value="20"><label for="minutes">분</label></div><div><input id="seconds" aria-label="초" inputmode="decimal" type="number" min="0" max="59.9" step="0.1" value="0"><label for="seconds">초</label></div></div></div></div><button class="calculate">랩 페이스 계산</button><p id="error" class="error" role="alert" hidden>목표 기록을 0초보다 크게 입력해 주세요.</p></form><div class="stats"><div><span>목표</span><strong id="goal"></strong></div><div><span>400m</span><strong id="lap"></strong></div><div><span>1km</span><strong id="pace"></strong></div><div><span>보정 후</span><strong id="adjusted"></strong></div></div></section><section><div class="sectionhead"><div><h2>랩별 목표</h2><small id="schedule"></small></div><button type="button" id="reset" class="reset">보정 초기화</button></div><div class="table"><div class="row thead"><div>거리 m</div><div>랩<br>1km 페이스</div><div>보정 초</div><div>누적</div><div>km 통과</div></div><div id="rows"></div></div><small style="display:block;margin-top:8px">랩 중간의 km 통과시간은 해당 랩의 일정한 페이스를 기준으로 계산합니다.</small><div class="summary" aria-live="polite"><div><span>보정 누계</span><strong id="sum"></strong></div><div><span>최종 기록</span><strong id="final"></strong></div><div><span>목표 대비</span><strong id="difference"></strong></div></div></section></main><script src="app.js"></script></body></html>
